project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "**/*.md"
    - "!checks/"
  resources:
    - LICENSE
    - LICENSES/
    - "**/*.md"

website:
  title: "Roles"
  description: "Agents made fully autonomous, each with a proof of reliability, packaged and served like tool servers."
  site-url: "https://tewf.github.io/roles/"
  repo-url: "https://github.com/Tewf/roles"
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    left:
      - text: Evidence
        href: evidence/README.md
      - text: Decisions
        href: decisions/README.md
    right:
      - text: The standard
        href: https://tewf.github.io/reader-ergonomics/
      - text: The family
        href: https://tewf.github.io/ai-augmented/
  sidebar:
    style: docked
    search: true
    contents: auto

# The stylesheet is reader-ergonomics' own, checked out into _standard/ at build time (pages.yml).
format:
  html:
    from: markdown-smart
    shift-heading-level-by: -1
    html-math-method: mathml
    toc: true
    toc-depth: 2
    theme:
      light: cosmo
      dark: darkly
    css: _standard/site.css
    link-external-newwindow: false
